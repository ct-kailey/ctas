name: ains-sism
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ains
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: ains
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - ains_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ains -d ains"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  ains_pg:
