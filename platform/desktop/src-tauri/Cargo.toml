[package]
name = "ctas-desktop"
version = "0.1.0"
description = "CTAS local workspace diagnostics and isolated Codex task runner"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "ctas_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
libc = "0.2"

[dev-dependencies]
tempfile = "3"
